name: ci

# Both platforms on every push and pull request, so a Dependabot bump has a
# status check to gate on and a GLEW-shaped break -- which macOS is
# structurally blind to, because macOS never links GLEW -- is caught before a
# tag. Both build the FFGL plugin AND the OpenFX plugin (BUILD_OFX is on by
# default). The OpenFX plugin's Linux build and its Rocky 8 load test live in
# release.yml, which a dispatch runs without publishing.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    name: macOS
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
        with:
          # The FFGL SDK is a submodule. Without this CMake fails at configure
          # time with a missing-directory error that reads like a broken repo.
          submodules: recursive

      - name: Configure
        # arm64 only, unlike the release build's universal arm64;x86_64 -- the
        # second slice doubles the build for no extra signal, because a source
        # break is not architecture-specific.
        #
        # REBATE_BUILD_TOOLS is ON here where the release build turns it OFF:
        # rbtest is the only place the physics is written down as a number,
        # so compiling and running it is most of the value.
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES=arm64
          -DREBATE_BUILD_TOOLS=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Parameters
        # No GL needed, so this one cannot be a runner problem.
        run: ./build/rbtest --list

      - name: Physics
        # The runner has no accelerated GL; the harness falls back to a
        # software context. 320x180, because software rasterisation is slow
        # and every check here was written to hold at any raster: the wedges
        # sample step centres, the grain's interval is the sample variance's
        # own at whatever n the raster gives, and the rebate is laid out in
        # film millimetres. verify.sh runs them at 1280x720 as well.
        timeout-minutes: 20
        run: |
          ./build/rbtest --curve    --size 320x180
          ./build/rbtest --push     --size 320x180
          ./build/rbtest --mask     --size 320x180
          ./build/rbtest --grain    --size 320x180
          ./build/rbtest --leak     --size 320x180
          ./build/rbtest --cross    --size 320x180
          ./build/rbtest --rebate   --size 320x180
          ./build/rbtest --seed     --size 320x180
          ./build/rbtest --resize   --size 320x180
          ./build/rbtest --negative --size 320x180
          ./build/rbtest --cpu      --size 320x180

      - name: Controls
        # At 160x90 and two at a time, because the runner has no GPU and the
        # question is only whether a control changed ANY subpixel. Graticule's
        # first run of this step at 320x180 was still going at twenty minutes.
        timeout-minutes: 25
        run: python3 tools/sweep.py --size 160x90 --jobs 2

      - name: OpenFX bundle
        # The checks the release job and tools/verify.sh make, on every push:
        # the plist names the binary that is there (a copied plist passes
        # everything until codesign at release), the entry point is exported,
        # and the bundle signs. `--cpu` above is what checks it renders the
        # same film.
        #
        # Captured and matched with `case`, never `nm | grep -q`: under
        # `bash -eo pipefail` grep exits on its first match, nm takes SIGPIPE,
        # and the step fails on a correct binary.
        shell: bash
        run: |
          bundle=build/Rebate.ofx.bundle
          exe=$( /usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$bundle/Contents/Info.plist" )
          test -f "$bundle/Contents/MacOS/$exe"
          __symbols=$( nm -gU "$bundle/Contents/MacOS/$exe" )
          case "$__symbols" in
            *_OfxGetPlugin*) ;;
            *) echo "expected _OfxGetPlugin, got: $__symbols"; exit 1 ;;
          esac
          codesign --force --sign - --timestamp=none "$bundle"

      - uses: actions/upload-artifact@v7
        with:
          name: rebate-macos-arm64
          path: |
            build/Rebate.bundle
            build/Rebate.ofx.bundle
          if-no-files-found: error

  windows:
    name: Windows
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Configure
        # The toolchain path MUST stay double-quoted: a `run:` step on Windows
        # is PowerShell, and unquoted this expands to nothing.
        run: >
          cmake -B build -A x64
          -DCMAKE_BUILD_TYPE=Release
          -DREBATE_BUILD_TOOLS=OFF
          -DVCPKG_TARGET_TRIPLET=x64-windows-static-md
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: OpenFX bundle
        # The .ofx lands in the bundle's Win64 folder, not build/Release:
        # CMakeLists pins the Release output directories, and gives the
        # target its own ARCHIVE directory so its .exp/.lib cannot race the
        # FFGL target's (LNK1104).
        shell: bash
        run: test -f build/Rebate.ofx.bundle/Contents/Win64/Rebate.ofx

      - uses: actions/upload-artifact@v7
        with:
          name: rebate-windows-x86_64
          path: |
            build/Release/*.dll
            build/Rebate.ofx.bundle/Contents/Win64/Rebate.ofx
          if-no-files-found: error
