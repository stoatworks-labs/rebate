  <body>
    <main id="demo">
      <noscript>
        <h1>Rebate</h1>
        <p>
          An FFGL effect that exposes your clip onto a three-layer colour
          negative, develops each layer along a characteristic curve into dye
          with an orange mask and grain, then scans and inverts it the way a lab
          scanner does. Grain that peaks in the mid-tones, the blue shadows of
          expired stock, a warm light leak that saturates and the warm cast of
          cross-processing all come from the process itself. There's no lookup
          table.
        </p>
        <p>
          This demo runs the plugin's shaders in your browser, so it needs
          JavaScript and WebGL2. The plugin itself, its source and its downloads
          are on
          <a href="https://github.com/stoatworks-labs/rebate">its repository</a>.
        </p>
        <ul>
          <li><a href="https://stoatworks-labs.com/software/rebate/">Project page and downloads</a></li>

          <li><a href="https://github.com/stoatworks-labs/rebate">Source on GitHub</a></li>
        </ul>
      </noscript>
